[project]
name = "tc-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vatsalya Dabhi", email = "vatsalyadabhi2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "pydriller>=2.12",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.1",
    "tree-sitter-java>=0.23.5",
]

[project.scripts]
tc-detector = "tc_detector:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
